<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>GitHub User Info (Vanilla JS)</title>
  </head>
  <body>
    <h1>GitHub ユーザー情報取得</h1>

    <!-- 入力フォームとボタン -->
    <label for="usernameInput">GitHubユーザー名:</label>
    <input type="text" id="usernameInput" />
    <button id="fetchButton">取得</button>

    <!-- 結果表示エリア -->
    <h2>結果</h2>
    <pre id="result" style="color: blue"></pre>
    <pre id="error" style="color: red"></pre>

    <script>
      // APIからデータを取ってきてそのままログに出す
      async function fetchGitHubUserInfo(username) {
        // GitHubのユーザーAPIエンドポイント
        const url = `https://api.github.com/users/${username}`;

        console.log("=== [DEBUG] Fetching from:", url);

        try {
          const response = await fetch(url);
          console.log("=== [DEBUG] Response Status:", response.status);

          // ステータスコードが200番台（OK）の場合だけ成功とみなす
          if (response.ok) {
            const data = await response.json();
            console.log("=== [DEBUG] Full JSON data ===");
            console.log(data);

            // 取ってきたデータから必要なものだけをログにだす
            const userLogin = data.login || "N/A";
            const userId = data.id || "N/A";
            const userBio = data.bio || "N/A";

            console.log("=== [DEBUG] Filtered Data ===");
            console.log("UserName:", userLogin);
            console.log("ID      :", userId);
            console.log("Bio     :", userBio);

            // ログじゃなくて画面に出す & 4. 見た目を整える
            return `
● ユーザー名: ${userLogin}
● ユーザーID: ${userId}
● 自己紹介文: ${userBio}
`;
          } else {
            // 存在しないユーザー名や404などエラー時
            const errorMsg =
              `ユーザー情報を取得できませんでした。\n` +
              `・ユーザー名が正しいか確認してください\n` +
              `・レスポンスコード: ${response.status}`;
            throw new Error(errorMsg);
          }
        } catch (error) {
          console.error("=== [DEBUG] Error Occurred ===", error);
          throw error; // 上位で処理させるため再スロー
        }
      }

      // ボタンを押したときの処理
      document
        .getElementById("fetchButton")
        .addEventListener("click", async () => {
          // ボタンを押すと取得 → 入力フォームから任意アカウント情報を取れるようにする
          const usernameInput = document.getElementById("usernameInput");
          const resultArea = document.getElementById("result");
          const errorArea = document.getElementById("error");

          // 入力されたユーザー名を取得
          const username = usernameInput.value.trim();

          // 結果表示欄をリセット
          resultArea.textContent = "";
          errorArea.textContent = "";

          if (!username) {
            errorArea.textContent = "ユーザー名を入力してください。";
            return;
          }

          try {
            // APIコール
            const info = await fetchGitHubUserInfo(username);
            resultArea.textContent = info;
          } catch (err) {
            //  エラーハンドリング
            errorArea.textContent = err.message;
          }
        });
    </script>
  </body>
</html>
